<style>
:root{--bg:#f0f2f7;--surface:#ffffff;--surface2:#f5f7fc;--border:#dde1ee;--text:#1a1d2e;--muted:#6b7280;--accent:#4f7cf7;--accent2:#7c4fef;--red:#e53935;--orange:#f57c00;--green:#2e7d32;--yellow:#f9a825;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
header h1{font-size:15px;font-weight:600;flex:1}header h1 span{color:var(--accent)}
.btn{padding:6px 13px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s;font-weight:500}
.btn:hover{background:var(--border)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#3d68e0}
.shell{display:flex;min-height:calc(100vh - 49px)}
nav{width:190px;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0}
nav a{display:flex;align-items:center;gap:8px;padding:9px 18px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
nav a:hover{color:var(--text);background:var(--surface2)}
nav a.active{color:var(--accent);border-left-color:var(--accent);background:rgba(79,124,247,.08)}
main{flex:1;padding:20px;overflow-x:hidden}

.summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.kpi .value{font-size:22px;font-weight:700;letter-spacing:-.02em}

.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--surface2);color:var(--muted);font-weight:600;padding:9px 11px;text-align:left;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--surface2)}
td{padding:8px 11px;white-space:nowrap}

#toast{position:fixed;bottom:20px;right:20px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:10px 16px;font-size:12px;display:none;z-index:300}
#toast.ok{border-color:var(--green);color:var(--green)}#toast.err{border-color:var(--red);color:var(--red)}
</style>

<body>

<header>
  <h1>Pickup Scorecard <span>Breach Dashboard</span></h1>
  <button class="btn primary" onclick="publishToGH()">Publish Changes</button>
</header>

<div class="shell">
  <nav>
    <a class="active">📊 Overview</a>
  </nav>

  <main>
    <div class="summary-strip">
      <div class="kpi"><div class="label">Total Sellers</div><div class="value" id="kpi-sellers">0</div></div>
      <div class="kpi"><div class="label">Total Breaches</div><div class="value" id="kpi-breaches">0</div></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Seller ID</th>
            <th>Hub</th>
            <th>Breach Count</th>
            <th>Category</th>
            <th>Account Manager</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
let dashboardData = { sellers: [] };

function loadData() {
  try {
    const raw = document.getElementById('_d').textContent;
    dashboardData = JSON.parse(raw);
    renderDashboard();
  } catch (e) {
    console.error("Failed to parse embedded data", e);
  }
}

function renderDashboard() {
  const sellers = dashboardData.sellers || [];
  document.getElementById('kpi-sellers').innerText = sellers.length;
  
  let totalBreaches = 0;
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  sellers.forEach(s => {
    const breaches = s[3] || 0;
    totalBreaches += breaches;
    
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${s[0]}</td>
      <td>${s[1]}</td>
      <td>${breaches}</td>
      <td>${s[15] || 'N/A'}</td>
      <td>${s[18] || 'N/A'}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('kpi-breaches').innerText = totalBreaches;
}

async function publishToGH() {
  const token = localStorage.getItem('gh_token') || prompt("Enter GitHub Personal Access Token:");
  const repo = localStorage.getItem('gh_repo') || prompt("Enter repository (format: username/repo-name):");
  const branch = 'main'; // or 'gh-pages' depending on your settings

  if (!token || !repo) {
    alert("Token and Repository are required to publish.");
    return;
  }

  localStorage.setItem('gh_token', token);
  localStorage.setItem('gh_repo', repo);

  showToast("Publishing update directly to GitHub Pages...", "ok");

  try {
    const filePath = 'index.html';
    const getUrl = `https://api.github.com/repos/${repo}/contents/${filePath}?ref=${branch}`;
    
    // 1. Get current file SHA required by GitHub API to update an existing file
    let sha = '';
    const getRes = await fetch(getUrl, {
      headers: { 'Authorization': `token ${token}` }
    });
    if (getRes.ok) {
      const fileData = await getRes.json();
      sha = fileData.sha;
    }

    // 2. Prepare HTML content
    const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    
    // Base64 encode for GitHub API (with UTF-8 support)
    const encodedContent = btoa(unescape(encodeURIComponent(htmlContent)));

    // 3. Commit file directly to repository main branch
    const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: "Update dashboard data [skip ci]",
        content: encodedContent,
        sha: sha,
        branch: branch
      })
    });

    if (putRes.ok) {
      showToast("Published! GitHub Pages will reflect changes in 1-2 minutes.", "ok");
    } else {
      const errData = await putRes.json();
      throw new Error(errData.message || "Failed to commit file to GitHub.");
    }
  } catch (err) {
    showToast("Publishing failed: " + err.message, "err");
  }
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.innerText = msg;
  toast.className = type;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 4000);
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
