<script>
// Corrected GitHub API Publisher with Asset Overwrite & Cache Busting
async function publishToGH() {
  const token = localStorage.getItem('gh_token');
  const repo = localStorage.getItem('gh_repo'); // format: "owner/repository"
  const tag = localStorage.getItem('gh_tag') || 'v1.0.0';
  
  if (!token || !repo) {
    alert("Please configure GitHub Token and Repository first in settings.");
    return;
  }

  showToast("Publishing update to GitHub...", "ok");

  try {
    // 1. Fetch release details to get release ID and upload_url
    const relRes = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, {
      headers: { 'Authorization': `token ${token}` }
    });
    
    if (!relRes.ok) throw new Error("Release tag not found on GitHub repository.");
    const release = await relRes.json();

    // 2. Delete existing file asset if present (to avoid 422 Conflict error)
    const existingAsset = release.assets.find(a => a.name === 'index.html');
    if (existingAsset) {
      await fetch(`https://api.github.com/repos/${repo}/releases/assets/${existingAsset.id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `token ${token}` }
      });
    }

    // 3. Prepare updated document content
    const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: 'text/html' });

    // 4. Upload fresh asset to GitHub Release
    const uploadUrl = release.upload_url.replace('{?name,label}', '?name=index.html');
    const uploadRes = await fetch(uploadUrl, {
      method: 'POST',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'text/html'
      },
      body: blob
    });

    if (uploadRes.ok) {
      showToast("Published successfully! Updating client view...", "ok");
      // Append cache buster to force fresh state across all systems
      window.location.search = '?v=' + new Date().getTime();
    } else {
      throw new Error("Failed to upload asset to release.");
    }
  } catch (err) {
    showToast("Publishing failed: " + err.message, "err");
  }
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.innerText = msg;
  toast.className = type;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 4000);
}
</script>
